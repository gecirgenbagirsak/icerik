name: IG senkron (saatlik)

on:
  schedule:
    - cron: "17 * * * *"    # her saat; paylasma karari betikte
  workflow_dispatch:
    inputs:
      kuru:
        description: "Sadece dene, paylasma"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ig-senkron
  cancel-in-progress: false

jobs:
  senkron:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Senkron
        env:
          IG_TOKENS: ${{ secrets.IG_TOKENS }}
          KURU: ${{ inputs.kuru }}
        run: python -u ig-senkron/senkron.py
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "ig-senkron-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ig-senkron/durum.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "ig senkron: durum" && git pull --rebase -q && git push)
