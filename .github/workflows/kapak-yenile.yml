name: YouTube kapak yenile (premium)

# Daha önce yüklenen videoların kapaklarını yeni Full HD premium tasarımla değiştirir.
on:
  workflow_dispatch:
    inputs:
      kanallar:
        description: "Kanallar (virgülle)"
        default: "gidersiz,anahtar"
      yeniden:
        description: "Daha önce yenilenenleri de yeniden yap"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/kapak-yenile.yml"

permissions:
  contents: write

concurrency:
  group: yt-senkron
  cancel-in-progress: false

jobs:
  yenile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - run: pip install -q google-api-python-client google-auth pillow numpy "opencv-python-headless<5"
      - name: Kapakları yenile
        env:
          YT_TOKENS: ${{ secrets.YT_TOKENS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KANALLAR: ${{ inputs.kanallar || 'gidersiz,anahtar' }}
          YENIDEN: ${{ inputs.yeniden || 'false' }}
        run: python -u yt-senkron/kapak_yenile.py
      - name: Örnek kapaklar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-kapaklar
          path: /tmp/*_*.jpg
          if-no-files-found: ignore
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "yt-senkron-bot"
          git config user.email "actions@users.noreply.github.com"
          git add yt-senkron/durum.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "yt senkron: premium kapaklar" && git pull --rebase -q && git push)
